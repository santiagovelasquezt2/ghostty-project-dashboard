name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install terminal tools
        run: brew install tmux btop uv node
      - name: Install locked development environment
        run: uv sync --locked --extra dev --python 3.13
      - name: Install preview formatter
        run: npm ci --prefix formatter --ignore-scripts
      - name: Run isolated tests
        run: uv run --locked --extra dev python -m unittest discover -s tests -v
      - name: Build distribution
        run: uv build
